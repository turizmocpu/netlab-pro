name: Build Windows
on:
workflow_dispatch:
push:
branches: [main]
permissions:
contents: read
jobs:
build:
runs-on: windows-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20
      cache: npm

  - name: Install dependencies
    run: npm install --no-audit --no-fund

  - name: Run tests
    run: npm test
    continue-on-error: false

  - name: Build Windows installer and portable app
    run: npm run dist

  - name: Upload EXE files
    uses: actions/upload-artifact@v4
    with:
      name: NetLabPro-Windows
      path: |
        dist/NetLabPro-Setup.exe
        dist/NetLabPro-Portable.exe
      if-no-files-found: error
      retention-days: 7


